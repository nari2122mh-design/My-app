workflows:
  unsigned-ios:
    name: Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo prebuild
        script: npx expo prebuild --platform ios
      - name: Install pods
        script: cd ios && pod install
      - name: Build unsigned archive
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Create IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$CM_BUILD_DIR/build/App.xcarchive/Products/Applications/"*.app "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          zip -qr App-unsigned.ipa Payload
    artifacts:
      - build/App-unsigned.ipa
